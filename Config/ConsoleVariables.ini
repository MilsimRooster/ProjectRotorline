; Keep gameplay responsive during controller qualification and remote testing.
; UE 5.8 marks this as a cheat CVar, so it must live here rather than Engine.ini.
t.IdleWhenNotForeground=0

; Epic recommends excluding non-Nanite geometry from VSM coarse pages in
; foliage-heavy scenes. This prevents the non-Nanite marking queue overflow
; without suppressing its warning or disabling useful near-field shadows.
r.Shadow.Virtual.NonNanite.IncludeInCoarsePages=0

; Rotorline's large island is primarily non-Nanite low-poly geometry. UE 5.8's
; VSM marking-job queue is a fixed shader allocation and still overflows even
; with non-Nanite coarse pages disabled. Use conventional shadow maps for this
; project instead of hiding the overflow warning.
r.Shadow.Virtual.Enable=0
